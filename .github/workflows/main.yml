name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main # Schimba in 'master' daca e cazul

jobs:
  deploy:
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App Bundle
        run: |
          # Generam structura de fisiere de iOS fara semnare
          flutter build ios --release --no-codesign

      - name: Package to IPA (Manual Payload)
        run: |
          # Cream structura standard ceruta de Apple pentru un fisier .ipa
          mkdir -p Payload
          
          # Copiem aplicatia compilata de Flutter in folderul Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          
          # Impachetam folderul ca fisier .ipa folosind utilitarul de zip din macOS
          zip -r app.ipa Payload
          
          # Verificam ca fisierul s-a creat si are dimensiune corecta
          ls -lh app.ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'app.ipa'
          app-type: 'ios'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
