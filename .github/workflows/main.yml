name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main # Schimbă în 'master' dacă e cazul

jobs:
  deploy:
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Build Unsigned IPA
        # Folosim o acțiune stabilă care se ocupă nativ de exportul .ipa din Flutter
        uses: yukiw/build-flutter-ipa-action@v1.7.0
        with:
          # Îi spunem să nu ceară certificate locale, semnarea urmând să se facă în cloud la Apple
          args: --no-codesign

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          # Această acțiune salvează automat .ipa-ul generat în path-ul de mai jos
          app-path: 'output.ipa'
          app-type: 'ios'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
