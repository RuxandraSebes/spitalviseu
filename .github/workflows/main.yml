name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main # Sau 'master', în funcție de cum se numește ramura ta principală

jobs:
  deploy:
    runs-on: macos-14 # Folosește un runner macOS stabil și actualizat
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (necesar pentru anumite dependințe interne)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Build IPA (No Code Signing)
        run: |
          # Generăm direct fișierul .ipa nesemnat
          flutter build ipa --release --no-codesign

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          # Indicăm calea către fișierul .ipa generat de Flutter
          app-path: 'build/ios/ipa/spital_visu_upu.ipa' 
          app-type: 'ios'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          # Am corectat denumirea parametrului aici:
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
