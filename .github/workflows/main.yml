name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main # Schimbă în 'master' dacă asta e ramura ta principală
  workflow_dispatch: # permite repornirea manuală din tab-ul Actions

jobs:
  deploy:
    runs-on: macos-26 # macos-14 a fost retras din GitHub Actions pe 2 noiembrie 2026
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build and Sign IPA (Cloud Sync)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEVELOPMENT_TEAM: 'LV6P7A9VZD'
          PROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          # 1. Configurare cheie privată pentru Xcode Cloud Signing
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

          # 2. Dezactivăm funcția experimentală Swift Package Manager din Flutter
          flutter config --no-enable-swift-package-manager

          # 3. Curățăm complet cache-ul și folderele CocoaPods vechi
          cd ios
          rm -rf Pods Podfile.lock .symlinks Runner.xcworkspace
          pod cache clean --all
          cd ..

          # 4. Generăm fișierele native de configurare pe curat
          flutter build ios --config-only --no-codesign
          
          # 5. Reinstalăm pod-urile native (fără SPM, doar CocoaPods stabil)
          cd ios
          pod install
          cd ..

          # 6. Decodăm și pregătim profilul de distribuție salvat în Secrets
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/temp.mobileprovision

          # 7. Extragem UUID-ul unic al profilului pentru a-l mapa corect în Xcode
          UUID=$(grep -a -A 1 "UUID" ~/Library/MobileDevice/Provisioning\ Profiles/temp.mobileprovision | grep -o "[-A-Z0-9]\{36\}")
          echo "UUID identificat: $UUID"
          mv ~/Library/MobileDevice/Provisioning\ Profiles/temp.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          # 8. Generăm fișierul de instrucțiuni de export (ExportOptions.plist)
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$DEVELOPMENT_TEAM</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.ApostolFlorin.SpitalulOrasanescViseuDeSus</key>
                  <string>$UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

          # 9. Rulăm arhivarea nativă Xcode forțând SDK-ul de distribuție (fără erori de dispozitive)
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/archive/Runner.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE="$UUID" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"

          # 10. Exportăm arhiva finală într-un fișier .ipa semnat
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath output_folder \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"

          # 11. Scoatem fișierul .ipa la suprafață
          find output_folder -name "*.ipa" -exec cp {} app.ipa \;

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'app.ipa'
          app-type: 'ios'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
