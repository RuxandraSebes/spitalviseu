name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main # Schimbă în 'master' dacă e cazul

jobs:
  deploy:
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Build Xcode Archive
        run: |
          # Generăm arhiva brută
          flutter build ios --release --no-codesign

      - name: Find and Move Archive
        run: |
          # Creăm un folder sigur la rădăcină
          mkdir -p final_archive
          
          # Căutăm fișierul .xcarchive în tot folderul build și îl mutăm în folderul nostru sigur
          find build -name "*.xcarchive" -exec cp -R {} final_archive/Runner.xcarchive \;
          
          # Verificăm vizual în log-uri că fișierul chiar există acolo acum
          ls -ld final_archive/Runner.xcarchive

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          # Acum calea este 100% garantată și fixă
          app-path: 'final_archive/Runner.xcarchive'
          app-type: 'ios'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
