name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main # Sau 'master', în funcție de cum se numește ramura ta principală

jobs:
  deploy:
    runs-on: macos-14 # Folosește un runner macOS stabil și actualizat
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (necesar pentru anumite dependințe interne)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Build IPA (No Code Signing)
        run: |
          flutter build ipa --release --no-codesign

      - name: Locate and Prepare IPA
        run: |
          # Căutăm orice fișier .ipa generat în folderul build/ și îl copiem într-un loc fix cu numele 'app.ipa'
          mkdir -p build/assets_to_upload
          find build/ios/ipa -name "*.ipa" -exec cp {} build/assets_to_upload/app.ipa \;
          
          # Verificăm în log-uri dacă fișierul a fost găsit și mutat cu succes
          ls -lh build/assets_to_upload/app.ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          # Acum calea este mereu fixă și sigură:
          app-path: 'build/assets_to_upload/app.ipa'
          app-type: 'ios'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}  
