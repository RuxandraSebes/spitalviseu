name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App Bundle
        run: |
          flutter build ios --release --no-codesign

      - name: Package to IPA (With Provisioning Profile)
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          
          # Decodam profilul din GitHub Secrets si il punem in interiorul aplicatiei
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > Payload/Runner.app/embedded.mobileprovision
          
          # Impachetam totul intr-un .ipa valid
          zip -r app.ipa Payload
          ls -lh app.ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'app.ipa'
          app-type: 'ios'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
