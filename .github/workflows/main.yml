name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main # Sau 'master', în funcție de cum se numește ramura ta principală

jobs:
  deploy:
    runs-on: macos-14 # Folosește un runner macOS stabil și actualizat
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (necesar pentru anumite dependințe interne)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Build Xcode Archive (No Code Signing)
        run: |
          # Îi spunem lui Flutter să creeze arhiva fără să ceară certificate locale
          flutter build ipa --release --no-codesign

      - name: Upload and Sign in Apple Cloud
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'build/ios/archive/Runner.xcarchive' # Trimitem arhiva brută
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-key-content: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
