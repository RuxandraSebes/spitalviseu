name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main # Sau 'master', în funcție de cum se numește ramura ta principală

jobs:
  deploy:
    runs-on: macos-14 # Folosește un runner macOS stabil și actualizat
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (necesar pentru anumite dependințe interne)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Build IPA
        run: |
          # Xcode are nevoie de o identitate de semnare. Flutter build ipa poate genera arhiva nesemnată local, 
          # dar gata de a fi trimisă prin API-ul de App Store Connect care se ocupă de semnare în cloud.
          flutter build ipa --release --export-method app-store

      - name: Upload to App Store Connect (TestFlight)
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Creăm fișierul fizic al cheii private pe runner-ul de macOS pentru ca utilitarul Apple să o poată citi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          
          # Găsim fișierul .ipa generat de Flutter
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          
          # Folosim utilitarul nativ Apple (xcrun altool) pentru a urca aplicația
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
